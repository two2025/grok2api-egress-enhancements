name: CPA Plugin Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux amd64 (.so)
          - goos: linux
            goarch: amd64
            target_ext: ".so"
            archive_ext: "tar.gz"
            cc: gcc
          # Windows amd64 (.dll)
          - goos: windows
            goarch: amd64
            target_ext: ".dll"
            archive_ext: "zip"
            cc: x86_64-w64-mingw32-gcc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Install MinGW Cross-Compiler
        if: matrix.goos == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build Shared Library
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p dist
          # -buildmode=c-shared 会同时生成 .dll/.so 以及对应的 .h 头文件
          go build -trimpath -ldflags="-s -w" -buildmode=c-shared -o dist/cpa-plugin-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.target_ext }} .

      - name: Package Artifacts (Linux)
        if: matrix.goos == 'linux'
        run: |
          cd dist
          tar -czvf cpa-plugin-linux-amd64.tar.gz cpa-plugin-linux-amd64.so cpa-plugin-linux-amd64.h

      - name: Package Artifacts (Windows)
        if: matrix.goos == 'windows'
        run: |
          cd dist
          zip cpa-plugin-windows-amd64.zip cpa-plugin-windows-amd64.dll cpa-plugin-windows-amd64.h

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.so
            dist/*.dll
            dist/*.h
