name: CPA plugin release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: '手动构建版本号 (例如: 1.1.1)'
        required: false
        default: '1.1.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cpa-plugin/go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cpa-plugin/go/go.mod
          cache-dependency-path: cpa-plugin/go/go.sum

      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64 zip
        working-directory: .

      - name: Verify tag and test
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
            grep -Eq "pluginVersion[[:space:]]*= \"${version}\"" main.go
          fi
          go test ./...

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          
          dist="${GITHUB_WORKSPACE}/dist"
          mkdir -p "${dist}/linux_amd64" "${dist}/linux_arm64" "${dist}/windows_amd64"

          # 1. Linux amd64 (.so)
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 CC=gcc \
            go build -buildvcs=false -buildmode=c-shared -trimpath \
            -o "${dist}/linux_amd64/grok2api-egress.so" .

          # 2. Linux arm64 (.so)
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            go build -buildvcs=false -buildmode=c-shared -trimpath \
            -o "${dist}/linux_arm64/grok2api-egress.so" .

          # 3. Windows amd64 (.dll)
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc \
            go build -buildvcs=false -buildmode=c-shared -trimpath \
            -o "${dist}/windows_amd64/grok2api-egress.dll" .

          # 打包产物
          cd "${dist}/linux_amd64"
          zip -q "${dist}/grok2api-egress_${version}_linux_amd64.zip" grok2api-egress.so
          cd "${dist}/linux_arm64"
          zip -q "${dist}/grok2api-egress_${version}_linux_arm64.zip" grok2api-egress.so
          cd "${dist}/windows_amd64"
          zip -q "${dist}/grok2api-egress_${version}_windows_amd64.zip" grok2api-egress.dll

          # 生成哈希校验
          cd "${dist}"
          sha256sum grok2api-egress_*.zip > checksums.txt

      # 手动运行模式下：将构建出的 zip 包上传到当前 Run 的 Artifacts 里方便直接下载
      - name: Upload Artifacts (for manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: grok2api-egress-packages
          path: |
            dist/*.zip
            dist/checksums.txt

      # Tag 推送模式下：正常发布到 GitHub Releases
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/grok2api-egress_*.zip
            dist/checksums.txt
